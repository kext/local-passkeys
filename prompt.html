<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Passkeys</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { width: 340px; margin: 20px; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    #origin { overflow-wrap: anywhere; }
    button { padding: 8px 20px; font: inherit; cursor: pointer; }
  </style>
  <script src="prompt.js" defer></script>

  </main>

</html>
